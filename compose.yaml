services:
  seller:
    build: .
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["--dossier", "/data/private.md", "--env-file", "/run/model.env", "--port", "8765"]
    volumes:
      - ./examples/letter_of_credit/organizations/seller:/data:ro
      - ${MODEL_ENV_FILE:?Set MODEL_ENV_FILE to your existing configuration}:/run/model.env:ro
    ports: ["127.0.0.1:8800:8765"]
